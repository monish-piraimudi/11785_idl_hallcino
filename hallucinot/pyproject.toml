[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucinot"
version = "0.1.0"
description = "Prediction-step Jacobian-lens trajectory collection for local language models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0",
  "transformers==5.16.0",
  "accelerate==1.12.0",
  "safetensors==0.8.0",
  "numpy==2.5.2",
  "jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
hallucinot = "hallucinot.cli:main"

[tool.setuptools.packages.find]
include = ["hallucinot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
